name: プレイ中の問題を報告する
description: 1回のプレイで起きた没入感・進行上の問題を報告します
title: "[Play report] "
body:
  - type: markdown
    attributes:
      value: |
        再現率が分からなくても構いません。1回のプレイで気になった挙動を、そのまま報告してください。

        個人情報、秘密、共有したくない会話内容は削除してください。

  - type: input
    id: story
    attributes:
      label: 作品名
      placeholder: 例：落ちていく部屋
    validations:
      required: true

  - type: dropdown
    id: mode
    attributes:
      label: 利用形態
      options:
        - ChatGPT テキスト
        - GPT Live / 音声
        - その他のLLM / AI
        - その他
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 問題の種類
      options:
        - GM内部ルール・原本・API/MCPなどをプレイヤー向けに説明した
        - 未知の世界情報をプレイヤー側に作らせた
        - その世界の住人なら当然知ることを知識クイズにした
        - 一度提示した事実を後から変更した
        - 予定された筋書きや正解へ強引に戻した
        - 紹介されたジャンル・雰囲気を勝手に変えた
        - 作品選択・検索・取得で問題が起きた
        - その他
    validations:
      required: true

  - type: textarea
    id: happened
    attributes:
      label: 何が起きた？
      description: できるだけ短く、問題だと感じた点を書いてください。
    validations:
      required: true

  - type: textarea
    id: excerpt
    attributes:
      label: 問題が起きた前後の短い抜粋
      description: 必要な範囲だけ。個人情報や共有したくない内容は削除してください。
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: どう返ってほしかった？
      description: 厳密な正解でなくて構いません。没入感を保つならどうしてほしかったかを書いてください。
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: 分かる範囲の環境
      description: モデル名、アプリ、ブラウザなど。分からなければ空欄で構いません。
      placeholder: 例：ChatGPT / GPT Live

  - type: checkboxes
    id: privacy
    attributes:
      label: 公開内容の確認
      options:
        - label: このIssueが公開されることを理解し、個人情報や共有したくない会話を削除しました。
    validations:
      required: true
